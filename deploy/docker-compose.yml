# docker compose -f deploy/docker-compose.yml up -d --build   (aus dem LiChat-Ordner; Einstellungen in deploy/.env, siehe docs/SERVER.md)
services:
  lichat:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: lichat-server
    restart: unless-stopped
    ports: ["127.0.0.1:8440:8000"]          # only nginx reaches it
    environment:
      LICHAT_TRUSTED_PROXIES: "172.30.0.1"   # nginx through the bridge: X-Real-IP is believed only from there
      LICHAT_OEFFENTLICH: "https://${LICHAT_DOMAIN:?LICHAT_DOMAIN in deploy/.env eintragen}"   # for invitation links
    volumes:
      - ${LICHAT_DATEN:?LICHAT_DATEN in deploy/.env eintragen}:/daten   # on a disk, never on a Pi's SD card
    networks: [lichat]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging:                                  # logs must never fill a small disk
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
    cap_drop: [ALL]
networks:
  lichat:
    ipam: { config: [{ subnet: 172.30.0.0/24, gateway: 172.30.0.1 }] }
