# LiChat – Server-API. Datenschutz: keine Zugriffsprotokolle. Zertifikat: certbot --nginx -d lichat.lisoftware.de
server {
    server_name lichat.lisoftware.de;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 5m;

    # Attachments (card 9780f3a0): encrypted, up to 100 MB – only here more than 5 MB.
    location /v1/anhaenge {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:8440;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /v1/ {
        proxy_pass http://127.0.0.1:8440;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The apps keep one waiting fetch open (up to 60 s) – the proxy must wait longer.
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }

    listen 80;
    listen [::]:80;
}
