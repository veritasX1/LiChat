[package]
name = "lichat_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
aes-gcm = "0.10"
openmls = "0.9.1"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"], optional = true }
tls_codec = { version = "0.5.0", features = ["derive"] }
