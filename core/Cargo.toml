[package]
name = "lichat_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[features]
python = ["dep:pyo3"]
# Android (Kotlin via uniffi): cargo ndk -t arm64-v8a build --release --features mobile
mobile = ["dep:uniffi"]
# The generator: cargo run --features bindgen --bin uniffi-bindgen -- generate --library <lib.so> --language kotlin --out-dir …
bindgen = ["mobile", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
aes-gcm = "0.10"
openmls = "0.9.1"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"], optional = true }
uniffi = { version = "0.32.2", optional = true }
tls_codec = { version = "0.5.0", features = ["derive"] }
